<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Maplibre GL Inspect</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <link href='https://unpkg.com/maplibre-gl@^6.0.0/dist/maplibre-gl.css' rel='stylesheet' />
    <link href='../dist/maplibre-gl-inspect.css' rel='stylesheet' />
    <style>
        body { margin:0; padding:0; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
    </style>
</head>
<body>

<div id='map'></div>
<script type='module'>
import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.0.0/dist/maplibre-gl.mjs';
import MaplibreInspect from '../dist/maplibre-gl-inspect.mjs';

window.maplibregl = maplibregl;

var map = new maplibregl.Map({
    container: 'map', // container id
	style: 'https://demotiles.maplibre.org/style.json', // style URL
    center: [-74.50, 40], // starting position [lng, lat]
    zoom: 3, // starting zoom
    hash: true
});
map.addControl(new maplibregl.NavigationControl());
map.addControl(new MaplibreInspect({
    showMapPopup: true,
    showMapPopupOnHover: false,
    showInspectMapPopupOnHover: true,
    blockHoverPopupOnClick: true,
}));
</script>

</body>
</html>
