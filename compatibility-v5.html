<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>Maplibre GL Inspect - MapLibre GL JS v5 compatibility</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' rel='stylesheet' />
    <script src='https://unpkg.com/@maplibre/maplibre-gl-inspect@latest/dist/maplibre-gl-inspect.js'></script>
    <link href='https://unpkg.com/@maplibre/maplibre-gl-inspect@latest/dist/maplibre-gl-inspect.css' rel='stylesheet' />
    <style>
        body { margin:0; padding:0; }
        #map { position:absolute; top:0; bottom:0; width:100%; }
    </style>
</head>
<body>

<div id='map'></div>
<script>
var map = new maplibregl.Map({
    container: 'map',
    style: 'https://demotiles.maplibre.org/style.json',
    center: [-74.50, 40],
    zoom: 3
});
map.addControl(new maplibregl.NavigationControl());
var inspect = new MaplibreInspect({
    showInspectMap: true,
    sources: {
        maplibre: ['geolines', 'centroids', 'countries'],
        crimea: []
    }
});
map.addControl(inspect);

function showInspectMap() {
    var style = map.getStyle();
    if (!style.layers || style.layers.length === 0) return;
    map.off('styledata', showInspectMap);
    inspect.setOriginalStyle(style);
    inspect.render();
}
map.on('styledata', showInspectMap);
showInspectMap();
</script>

</body>
</html>
